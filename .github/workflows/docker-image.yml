name: Docker Image CI

on:
  push:
    branches: ["main"]

  workflow_dispatch:
    inputs:
      tag:
        description: "Enter Docker image version tag, e.g. v2 or v3"
        required: true
        default: "v2"
        type: string

  schedule:
    - cron: "30 3 * * 1"

env:
  DOCKER_IMAGE: snehatiwari18/docker-image-practice

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Show workflow variables
        run: |
          echo "Image: $DOCKER_IMAGE"
          echo "Branch: $GITHUB_REF_NAME"
          echo "Event: $GITHUB_EVENT_NAME"

      - name: Choose Docker tag
        id: vars
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            TAG="$INPUT_TAG"
          else
            TAG="latest"
          fi

          if [[ ! "$TAG" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]; then
            echo "Invalid Docker tag: $TAG"
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Selected tag: $TAG"

      - name: Build and push image tags
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.DOCKER_IMAGE }}:${{ steps.vars.outputs.tag }}
            ${{ env.DOCKER_IMAGE }}:latest
            ${{ env.DOCKER_IMAGE }}:sha-${{ github.sha }}

  deploy:
    needs: build-and-push
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy to AWS EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo docker pull snehatiwari18/docker-image-practice:latest
            sudo docker rm -f sneha-app || true
            sudo docker run -d --name sneha-app -p 80:80 --restart unless-stopped snehatiwari18/docker-image-practice:latest
  practice-if-else:
    runs-on: ubuntu-latest
    steps:
      - name: Check selected tag
        env:
          IMAGE_TAG: ${{ inputs.tag }}
        run: |
          if [ "$IMAGE_TAG" = "v2" ]; then
            echo "IF condition: Tag is v2"
          else
            echo "ELSE condition: Tag is not v2"
          fi

      - name: Run only when previous step succeeds
        if: ${{ success() }}
        run: echo "Previous step succeeded!"
  practice-failure-always:
    runs-on: ubuntu-latest
    steps:
      - name: Simulate a failure
        run: |
          echo "This step will fail intentionally"
          exit 1

      - name: Run only on failure
        if: ${{ failure() }}
        run: echo "The previous step failed!"

      - name: Always run this step
        if: ${{ always() }}
        run: echo "This step runs even after failure!"
 practice-marketplace-cache:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore Marketplace cache
        id: demo-cache
        uses: actions/cache@v5
        with:
          path: cache-demo/
          key: marketplace-cache-${{ runner.os }}-${{ hashFiles('README.md') }}
          restore-keys: |
            marketplace-cache-${{ runner.os }}-

      - name: Create sample data on cache miss
        if: steps.demo-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p cache-demo
          echo "GitHub Marketplace cache practical" > cache-demo/message.txt
          echo "Cache miss: sample data created"

      - name: Verify cached data
        run: |
          cat cache-demo/message.txt
          echo "Cache hit: ${{ steps.demo-cache.outputs.cache-hit }}"
