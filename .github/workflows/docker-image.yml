name: Docker Image CI

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * 1"

env:
  DOCKER_IMAGE: snehatiwari18/docker-image-practice

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Show workflow variables
        run: |
          echo "Image: $DOCKER_IMAGE"
          echo "Branch: $GITHUB_REF_NAME"

      - name: Build and push image tags
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            snehatiwari18/docker-image-practice:latest
            snehatiwari18/docker-image-practice:v1
            snehatiwari18/docker-image-practice:sha-${{ github.sha }}

  deploy:
    needs: build-and-push
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy to AWS EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo docker pull snehatiwari18/docker-image-practice:latest
            sudo docker rm -f sneha-app || true
            sudo docker run -d --name sneha-app -p 80:80 --restart unless-stopped snehatiwari18/docker-image-practice:latest
